spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jobsearch
    username: ${POSTGRES_USER:jobsearch}
    password: ${POSTGRES_PASSWORD:jobsearch}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080
  error:
    include-message: always

app:
  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    max-tokens: ${OPENAI_MAX_TOKENS:4096}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
